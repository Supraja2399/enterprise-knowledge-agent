[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-agent"
version = "1.0.0"
description = "Enterprise Knowledge Agent — Vertex AI pattern, locally runnable (Tiger Analytics FDE proof)"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
where = ["src"]
